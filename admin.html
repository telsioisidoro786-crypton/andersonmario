<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Anderson Mário</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23ff2e93%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-size=%2728%27 font-family=%27Impact,sans-serif%27 text-anchor=%27middle%27 fill=%27%231a0a00%27%3EAM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  body{padding:100px 0 60px;background:var(--g100)}
  .box{background:var(--white);border:1px solid var(--g200);padding:28px}
  .login{width:min(420px,92%);margin:10vh auto;display:grid;gap:16px}
  .login h1{font-family:var(--head);font-weight:800;font-size:2rem;text-transform:uppercase}
  .meta{font-size:.84rem;color:var(--g600)}
  .tabs{display:flex;flex-wrap:wrap;gap:0;margin:22px 0 28px;border:1px solid var(--g200);background:var(--white);width:max-content;max-width:100%}
  .tabs button{background:none;border:0;border-right:1px solid var(--g200);color:var(--black);padding:12px 18px;cursor:pointer;font:600 .74rem var(--body);letter-spacing:.1em;text-transform:uppercase}
  .tabs button:last-child{border-right:0}
  .tabs button.on{background:var(--black);color:var(--white)}
  .adm-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:start}
  .adm-form{display:grid;gap:14px}
  .adm-form label{display:grid;gap:6px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--g600);font-weight:600}
  .adm-form input,.adm-form textarea,.adm-form select,.adm-in{background:var(--white);color:var(--black);border:1.5px solid var(--g200);padding:11px 13px;font:400 .95rem var(--body);width:100%;border-radius:0;letter-spacing:0;text-transform:none}
  .adm-form input:focus,.adm-form textarea:focus,.adm-form select:focus,.adm-in:focus{outline:none;border-color:var(--red)}
  .imgrow{display:flex;gap:8px;align-items:center}
  .imgrow input[type=file]{padding:8px;font-size:.78rem}
  .item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--g200)}
  .item b{display:block;font-size:.95rem}
  .item small{color:var(--g600)}
  .item .acts{display:flex;gap:6px;flex-shrink:0}
  .danger{border-color:var(--red)!important;color:var(--red)!important}
  .danger:hover{background:var(--red)!important;color:var(--white)!important}
  .top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .top h2{font-family:var(--head);font-weight:800;text-transform:uppercase;font-size:1.8rem}
  .note{font-size:.84rem;color:var(--red);min-height:1.2em}
  .setup{padding:20px;border:1.5px dashed var(--red);color:var(--red);margin:20px 0;background:var(--white)}
  .nav .link{color:var(--white);border-color:var(--white)}
  .nav .link:hover{background:var(--white);color:var(--black)}
  @media(max-width:900px){.adm-grid{grid-template-columns:1fr}.tabs{width:100%}}
</style>
</head>
<body>

<header class="nav"><a href="index.html" class="brand">Anderson Mário</a><a class="link" href="index.html">Ver site</a></header>

<div class="wrap" id="app">
  <div class="setup" id="noFb" hidden>
    O Firebase ainda não está activo. Edita <b>js/config.js</b>, cola as credenciais e põe <b>firebaseEnabled: true</b>. Ver README.md.
  </div>

  <!-- LOGIN -->
  <form class="box login" id="loginForm" hidden>
    <h1>Painel</h1>
    <p class="meta">Acesso reservado à equipa do artista.</p>
    <input class="adm-in" type="email" id="email" placeholder="E-mail" required autocomplete="username"
     >
    <input class="adm-in" type="password" id="pass" placeholder="Palavra-passe" required autocomplete="current-password"
     >
    <button class="btn btn-primary" type="submit">Entrar</button>
    <p class="note" id="loginMsg"></p>
  </form>

  <!-- PAINEL -->
  <div id="panel" hidden>
    <div class="top"><h2>Gestão do site</h2><button class="link" id="logout">Sair</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
